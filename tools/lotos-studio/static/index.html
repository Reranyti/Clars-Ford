<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotos Studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="shell">
  <aside id="side">
    <div class="brand"><span class="logo"></span><div><b>Lotos Studio</b><small>мастерская мода</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="kbd-hint" id="hint">Ctrl+K — поиск и команды</button></div>
  </aside>
  <div id="content">
    <header id="topbar">
      <button class="btn icon" id="burger" title="Меню"></button>
      <h1 id="ptitle"></h1>
      <div class="grow"></div>
      <div id="savestate" class="savestate"></div>
      <button class="btn" id="qc" title="Быстрая запись (Ctrl+J)">Быстрая запись</button>
      <button class="btn" id="kp" title="Поиск и команды (Ctrl+K)">Поиск</button>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="toasts"></div>
<script src="/js/core.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/episode.js"></script>
<script src="/js/story.js"></script>
<script src="/js/wiki.js"></script>
<script src="/js/diagrams.js"></script>
<script src="/js/notes.js"></script>
<script src="/js/timeline.js"></script>
<script src="/js/shader.js"></script>
<script src="/js/tools.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
