plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Mod jars pulled in with fg.deobf ship SRG-named mixin refmaps (Ex Meteor Shower's
            // SpyglassMixin, for one) - without remapping them the dev runs crash before our mod loads.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // Our own mixins (the WorldEdit biome fix) - the release jar lists them in its manifest.
            args '--mixin.config', "${mod_id}.mixins.json"

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -Photswap : opens a debug port on THIS computer only, so tools/HotSwap.java (Lotos Studio's
            // "apply changes") can swap changed classes into the running game. Off unless asked for.
            if (project.hasProperty('hotswap')) {
                jvmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // Used for journeymap-api: extracted directly from the installed JourneyMap 6.0.5 jar's
    // META-INF/jarjar (no confirmed live Maven repo for the v2.0.0 API on 1.20.1 — see libs/README.md).
    flatDir {
        dir 'libs'
    }

    maven {
        name = 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven {
        name = 'CurseMaven'
        url 'https://cursemaven.com'
        content {
            includeGroup("curse.maven")
        }
    }

    maven {
        name = 'EngineHub'
        url 'https://maven.enginehub.org/repo/'
        content {
            includeGroupByRegex("com\\.sk89q.*")
        }
    }

}

configurations {
    // Libraries for the separate overlay process only (com.lotusblight.overlay). They go into the jar as
    // plain files the mod hands to that process's classpath - Forge itself never loads them.
    overlayLib { transitive = false }
}

dependencies {
    // JCodec: decodes the finale video on the player's machine, in memory (overlay VideoStream).
    // BSD 2-Clause - see CREDITS.txt. Keep the version in step with NormalBranchTracks.LIBS.
    overlayLib 'org.jcodec:jcodec:0.2.5'
    overlayLib 'org.jcodec:jcodec-javase:0.2.5'
    compileOnly 'org.jcodec:jcodec:0.2.5'
    compileOnly 'org.jcodec:jcodec-javase:0.2.5'

    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // GeckoLib: animated block/entity models (lotus bloom, roots, liana sway).
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation("com.eliotlash.mclib:mclib:20")

    // YACL (YetAnotherConfigLib): soft dependency for an in-game config screen.
    compileOnly fg.deobf("dev.isxander:yet-another-config-lib:${yacl_version}")

    // JourneyMap API: soft dependency, waypoints/overlays for known outbreaks.
    // Coordinate reconstructs to libs/journeymap-api-forge-1.20.1-2.0.0.jar (flatDir naming: name-version.jar).
    compileOnly fg.deobf("blank:journeymap-api-forge-1.20.1:2.0.0")

    // TerraBlender: soft dependency for better overworld biome placement/compatibility than the
    // plain BiomeManager fallback. Coordinate reconstructs to libs/TerraBlender-forge-1.20.1-3.0.1.10.jar.
    compileOnly fg.deobf("blank:TerraBlender-forge-1.20.1:3.0.1.10")

    // Chat Overhaul: soft dependency, tints a player's chat nickname to match their locked-in
    // dialogue branch (see DialogueChoicePacket). Coordinate reconstructs to libs/chatoverhaul-1.0-1.20.1.jar.
    compileOnly fg.deobf("blank:chatoverhaul:1.0-1.20.1")

    // Cinematic: soft dependency - letterboxed camera shots in the Honcho meeting cutscene
    // (see client/compat/CinematicShots). Coordinate reconstructs to libs/cinematic-1.1.1.jar.
    compileOnly fg.deobf("blank:cinematic:1.1.1")

    // Streams Reflowing: soft dependency - the river-flow spread already reads it through vanilla's
    // getFlow; its public RiverEngine API is compiled against for the spawn-area river prebuild
    // (see worldgen/compat/StreamsRiverPrebuild). libs/StreamsReflowing-1.20.1-forge-2.13.1.jar.
    compileOnly fg.deobf("blank:StreamsReflowing-1.20.1-forge:2.13.1")

    // Curios API integration attempted and reverted — see LotusSeerLensItem's javadoc and
    // IDEAS_AND_MODS.md for why `implements ICurioItem` directly isn't safe as a soft dependency.

    // WorldEdit: hard dependency, per explicit request - used specifically for the one thing
    // vanilla/Forge has no clean API for (rewriting an already-generated chunk's biome storage,
    // see LotusTerritory's phase-4 "this is now real lotus_marsh" trigger). Block conversion stays
    // on plain Level#setBlock - WorldEdit gives no benefit there and adds per-call overhead.
    // Real Maven coordinate is "worldedit-forge-mc1.20" (no .1) - EngineHub didn't cut a separate
    // 1.20.1 build since nothing changed between 1.20 and 1.20.1 that WorldEdit cares about. The
    // Forge platform module alone doesn't carry the actual API classes (EditSession, BiomeType,
    // CuboidRegion, ...) - those live in worldedit-core, needed alongside it, not obfuscated so no
    // fg.deobf() wrapper.
    // compileOnly, not implementation: WorldEdit ships its own worldedit-core inside its mod jar
    // at runtime (it's the mandatory external mod itself, not something we bundle) - shading a
    // second copy in here would duplicate classes on the classpath against the real installed mod.
    compileOnly "com.sk89q.worldedit:worldedit-core:7.2.15"
    compileOnly fg.deobf("com.sk89q.worldedit:worldedit-forge-mc1.20:7.2.15")

    // Ex Meteor Shower: soft dependency for real comet visuals during the StarFall event
    // (com.lotusblight.escape / StarFallOverlay). CurseForge project 1461322, file 7756940
    // (meteor_shower-0.0.4.2.jar, the current Forge 1.20.1 build).
    compileOnly fg.deobf("curse.maven:ex-meteor-shower-1461322:7756940")

    // Mandatory mods for runClient/runServer (dev runs only - runtimeOnly never ends up inside the
    // built jar). The real distributed jars from libs/ (see libs/README.md), not the Maven modules:
    // WorldEdit's Maven forge module doesn't carry worldedit-core the way its mod jar does, and Ex
    // Meteor Shower needs OctoLib (-> Architectury) at runtime without declaring it.
    runtimeOnly fg.deobf("blank:worldedit-mod:7.2.15")
    runtimeOnly fg.deobf("blank:meteor_shower:0.0.4.2-1.20.1")
    runtimeOnly fg.deobf("blank:OctoLib-FORGE:0.5.0.1+1.20.1")
    runtimeOnly fg.deobf("blank:architectury:9.2.14-forge")
    runtimeOnly fg.deobf("blank:TerraBlender-forge-1.20.1:3.0.1.10")

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    // Blockbench working projects sometimes get saved next to the assets they edit - keep them out
    // of the jar.
    exclude '**/*.bbmodel'

    // The overlay process's own libraries, as plain files (see configurations.overlayLib).
    from(configurations.overlayLib) { into 'assets/lotusblight/overlay/lib' }
    // The finale video is NOT in the jar (120 MB): the game fetches it from the release on a roomy drive when the
    // fight needs it (see FinaleVideoStore). Without it the fight just plays with no animation.
    // Honcho's track for the lesson, likewise from a local folder that stays out of git; without it the
    // lesson is silent.
    from('art/music/contact') {
        include 'honcho_briefing.ogg'
        into 'assets/lotusblight/overlay'
    }
    // The third song, likewise from a local folder that stays out of git; without it the fight ends after two.
    from('art/music/third') {
        include 'you_cant.ogg'
        rename 'you_cant.ogg', 'song3.ogg'
        into 'assets/lotusblight/overlay'
    }
    // The music of the cutscene between the second and third songs: a track from the finale folder.
    from('art/music/finale') {
        include 'world_dialogue_world_lotus_boss.ogg'
        rename 'world_dialogue_world_lotus_boss.ogg', 'interlude.ogg'
        into 'assets/lotusblight/overlay'
    }

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The desktop overlay on its own, without starting the game: ./gradlew runOverlay [-Pseconds=N]
tasks.register('runOverlay', JavaExec) {
    classpath = sourceSets.main.output
    mainClass = 'com.lotusblight.overlay.OverlayMain'
    args '--seconds', project.findProperty('seconds') ?: '60'
    systemProperty 'lotusblight.overlay.debug', 'true'
}

// The exit over the desktop, error dialog to fight: ./gradlew runExit [-Pfrom=STAGE] [-PnoFight]
// STAGE: error, shatter, emerge, windows, fourth, error2, type, silence, stomp. The fight uses the same
// build/scene WAVs as runGame.
tasks.register('runExit', JavaExec) {
    classpath = sourceSets.main.output + configurations.overlayLib
    mainClass = 'com.lotusblight.overlay.ExitMain'
    def a = ['--jar', project.findProperty('jar') ?: "${mod_id}-${mod_version}.jar"]
    if (project.hasProperty('from')) a += ['--from', project.getProperty('from')]
    if (project.hasProperty('noFight')) a += ['--no-fight']
    if (file('build/scene/promised.wav').exists()) a += ['--song1', file('build/scene/promised.wav').absolutePath]
    if (file('build/scene/way.wav').exists()) a += ['--song2', file('build/scene/way.wav').absolutePath]
    // The animation: cut from art/video/finale.mp4 like the mod does, else ffmpeg's frames from build/scene.
    if (file('art/video/finale.mp4').exists()) {
        a += ['--video', file('art/video/finale.mp4').absolutePath]
    } else if (file('build/scene/frames').exists()) {
        a += ['--frames', file('build/scene/frames').absolutePath,
              '--animAudio', file('build/scene/frames/anim.wav').absolutePath, '--animFps', '30']
    }
    args a
}

// The walking-loop scene on its own, black full-screen: ./gradlew runTrail [-Pseconds=N]
tasks.register('runTrail', JavaExec) {
    classpath = sourceSets.main.output
    mainClass = 'com.lotusblight.overlay.TrailMain'
    args '--seconds', project.findProperty('seconds') ?: '30'
}

// The whole finale beat, synced to the track, from 2:15: ./gradlew runScene
// Needs build/scene/way.wav (the track as WAV) - regenerate with:
//   ffmpeg -i art/music/finale/boss11_the_way_im_wired.ogg -ar 44100 -ac 2 build/scene/way.wav
tasks.register('runScene', JavaExec) {
    classpath = sourceSets.main.output
    mainClass = 'com.lotusblight.overlay.SceneMain'
    def wav = file('build/scene/way.wav')
    def a = ['--seconds', project.findProperty('seconds') ?: '55', '--at', project.findProperty('at') ?: '135']
    if (wav.exists()) a += ['--audio', wav.absolutePath]
    args a
}

// The finale animation as a frame sequence + audio (how the overlay will show it): ./gradlew runAnim
// Frames live in build/scene/frames (f_0001.jpg..., anim.wav), made once with:
//   ffmpeg -i Анимация.mp4 -vf fps=15,scale=1280:720 -q:v 4 build/scene/frames/f_%04d.jpg
//   ffmpeg -i Анимация.mp4 -ar 44100 -ac 2 build/scene/frames/anim.wav
tasks.register('runAnim', JavaExec) {
    classpath = sourceSets.main.output
    mainClass = 'com.lotusblight.overlay.VideoMain'
    args '--frames', file('build/scene/frames').absolutePath,
            '--audio', file('build/scene/frames/anim.wav').absolutePath, '--fps', '30'
}

// The whole boss encounter end to end (song1 -> animation -> song2 -> results): ./gradlew runGame
tasks.register('runGame', JavaExec) {
    classpath = sourceSets.main.output + configurations.overlayLib
    mainClass = 'com.lotusblight.overlay.GameMain'
    def a = []
    if (file('build/scene/promised.wav').exists()) a += ['--song1', file('build/scene/promised.wav').absolutePath]
    if (file('build/scene/way.wav').exists()) a += ['--song2', file('build/scene/way.wav').absolutePath]
    // The animation straight from art/video/finale.mp4 like the mod plays it, else ffmpeg's frames.
    if (file('art/video/finale.mp4').exists()) {
        a += ['--video', file('art/video/finale.mp4').absolutePath]
    } else if (file('build/scene/frames').exists()) {
        a += ['--frames', file('build/scene/frames').absolutePath,
              '--animAudio', file('build/scene/frames/anim.wav').absolutePath, '--animFps', '30']
    }
    if (project.hasProperty('start2')) a += ['--start2', project.getProperty('start2')]   // preview song 2
    args a
}

// The first song's rhythm game (PROMISED FUTURE) over a backdrop: ./gradlew runRhythm
// Needs build/scene/promised.wav - regenerate with:
//   ffmpeg -i src/main/resources/assets/lotusblight/overlay/map_1.ogg -ar 44100 -ac 2 build/scene/promised.wav
tasks.register('runRhythm', JavaExec) {
    classpath = sourceSets.main.output
    mainClass = 'com.lotusblight.overlay.RhythmMain'
    def song = project.hasProperty('song') ? project.getProperty('song') : '1'
    def wav = file(song == '2' ? 'build/scene/way.wav' : 'build/scene/promised.wav')
    def a = ['--song', song]
    if (wav.exists()) a += ['--audio', wav.absolutePath]
    if (project.hasProperty('at')) a += ['--at', project.getProperty('at')]
    if (project.hasProperty('window')) a += ['--window']
    args a
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.register('lotusLibJar', Jar) {
    archiveBaseName = 'lotuslib'
    archiveVersion = project.version
    from(sourceSets.main.output) {
        include 'com/lotusblight/lib/**'
    }
    manifest {
        attributes([
                'Specification-Title': 'LotusLib API',
                'Specification-Vendor': mod_authors,
                'Specification-Version': project.version,
                'Implementation-Title': 'LotusLib API',
                'Implementation-Version': project.version,
                'Automatic-Module-Name': 'com.lotusblight.lib'
        ])
    }
}

tasks.named('jar', Jar).configure {
    dependsOn tasks.named('lotusLibJar')
    // GameTests and their arena only run through runGameTestServer - players don't need them.
    exclude 'com/lotusblight/gametest/**'
    exclude 'data/lotusblight/structures/honcho_arena.nbt'
    // Keep LotusLib classes bundled for reliable standalone Forge loading.
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
